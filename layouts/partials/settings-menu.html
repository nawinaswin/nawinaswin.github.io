<div class="settings-control relative {{ .class }}" data-settings-control>
    <button id="settings-toggle-{{ .id }}" type="button" data-settings-toggle aria-expanded="false" aria-controls="settings-panel-{{ .id }}" aria-label="Settings" title="Settings" class="inline-flex cursor-pointer items-center justify-center text-text-secondary-light dark:text-text-secondary-dark hover:text-text-primary-light dark:hover:text-text-primary-dark transition-colors duration-300 p-2 rounded-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent-light dark:focus-visible:outline-accent-dark">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.84 1.804A1 1 0 0 1 8.82 1h2.36a1 1 0 0 1 .98.804l.331 1.652a7 7 0 0 1 1.929 1.115l1.598-.54a1 1 0 0 1 1.186.447l1.18 2.044a1 1 0 0 1-.205 1.251l-1.267 1.113a7 7 0 0 1 0 2.228l1.267 1.113a1 1 0 0 1 .206 1.25l-1.18 2.045a1 1 0 0 1-1.187.447l-1.598-.54a7 7 0 0 1-1.929 1.115l-.33 1.652a1 1 0 0 1-.98.804H8.82a1 1 0 0 1-.98-.804l-.331-1.652a7 7 0 0 1-1.929-1.115l-1.598.54a1 1 0 0 1-1.186-.447l-1.18-2.044a1 1 0 0 1 .205-1.251l1.267-1.114a7 7 0 0 1 0-2.227L1.821 7.773a1 1 0 0 1-.206-1.25l1.18-2.045a1 1 0 0 1 1.187-.447l1.598.54a7 7 0 0 1 1.93-1.115zM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6" clip-rule="evenodd"/>
        </svg>
    </button>
    <div id="settings-panel-{{ .id }}" class="settings-dropdown" data-settings-panel role="group" aria-labelledby="settings-heading-{{ .id }}" hidden>
        <h2 id="settings-heading-{{ .id }}" class="text-base font-semibold text-text-primary-light dark:text-text-primary-dark mb-4">Settings</h2>
        <div class="flex items-center justify-between gap-4">
            <div class="min-w-0">
                <p id="background-animation-label-{{ .id }}" class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Background animation</p>
                <p id="background-animation-description-{{ .id }}" class="mt-1 text-xs leading-relaxed text-text-secondary-light dark:text-text-secondary-dark">Turn off the animated grid, pointer response, and gravitational wave that passes about every 20 seconds.</p>
            </div>
            <button type="button" class="settings-switch cursor-pointer" data-background-animation-switch role="switch" aria-checked="true" aria-labelledby="background-animation-label-{{ .id }}" aria-describedby="background-animation-description-{{ .id }}">
                <span class="settings-switch-thumb" aria-hidden="true"></span>
            </button>
        </div>
        <p class="mt-3 text-right text-xs text-text-secondary-light dark:text-text-secondary-dark" data-animation-status aria-live="polite">On</p>
    </div>
</div>
