{{ define "main" }}
<div class="w-full md:w-3/4 lg:w-1/2 mx-auto px-4 py-12">
    <h1 class="text-3xl md:text-5xl font-bold mb-8 md:mb-12 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
    
    <div class="grid grid-cols-1 gap-6 md:gap-8 max-w-3xl mx-auto">
        {{ range .RegularPages }}
        <div class="project-card relative overflow-hidden rounded-lg bg-[#121212] border border-gray-700 transition-all duration-300 group">
            <div class="p-6 flex flex-col justify-between h-full">
                <div>
                    <h3 class="text-xl md:text-2xl font-bold mb-2 text-white line-clamp-2">
                        <a href="{{ .RelPermalink }}" class="hover:text-accent-light dark:hover:text-accent-dark transition-colors duration-200">
                            {{ .Title }}
                        </a>
                    </h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-3">{{ .Summary }}</p>
                </div>
                <div class="flex items-center justify-between mt-4">
                    <time class="text-sm text-gray-500">{{ .Date.Format "January 2, 2006" }}</time>
                    <a href="{{ .RelPermalink }}" class="text-sm text-accent-light dark:text-accent-dark hover:text-text-primary-light dark:hover:text-text-primary-dark transition-colors duration-200">
                        View Project
                    </a>
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</div>

<style>
.project-card {
    min-height: 160px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    background: linear-gradient(to bottom right, rgba(30, 41, 59, 0.5), rgba(30, 41, 59, 0.8));
    backdrop-filter: blur(10px);
}

.project-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    border-color: rgba(59, 130, 246, 0.5);
}

.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.line-clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
</style>
{{ end }}
