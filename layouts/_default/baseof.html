<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
        <script src="{{ "js/theme.js" | relURL }}"></script>
        <link rel="stylesheet" href="{{ "css/site-theme.css" | relURL }}">
        
        <!-- Favicon here-->
        <link rel="apple-touch-icon" sizes="180x180" href="{{ .Site.BaseURL }}favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ .Site.BaseURL }}favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ .Site.BaseURL }}favicon_io/favicon-16x16.png">
        <link rel="manifest" href="{{ .Site.BaseURL }}favicon_io/site.webmanifest">        
        <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
        <link rel="preload" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" as="style">            
        <style>
            .carousel-item {
                display: inline-block;
                margin: 0 1rem;
            }            
            .flex {
                display: flex;
            }
            .flex-col {
                flex-direction: column;
            }
            
            @media (min-width: 768px) {
                .md\:flex-row {
                    flex-direction: row;
                }
            }
            
            .tech-carousel {
                overflow: hidden;
                width: 100%;
                padding: 1rem 0;
            }
            
            .carousel-track {
                white-space: nowrap;
            }
        </style>
        
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            const siteColors = {};
            for (const mode of ['light', 'dark']) {
                for (const [name, variable] of Object.entries({
                    'bg-primary': 'surface-primary',
                    'bg-secondary': 'surface-secondary',
                    'bg-tertiary': 'surface-tertiary',
                    'text-primary': 'text-primary',
                    'text-secondary': 'text-secondary',
                    'text-tertiary': 'text-tertiary',
                    'border-primary': 'border-primary',
                    'border-secondary': 'border-secondary',
                    'accent': 'accent'
                })) {
                    siteColors[`${name}-${mode}`] = `var(--${variable})`;
                }
            }
            tailwind.config = { darkMode: 'class', theme: { extend: { colors: siteColors } } };
        </script>
        <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
        <style>
            
            .tech-icon {
                filter: grayscale(100%) brightness(200%);
                transition: all 0.3s ease;
            }
            .tech-icon:hover {
                filter: none;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-100%);
                }
            }
            
            .tech-carousel {
                width: 100%;
                padding: 1rem 0;
            }
            
            .tech-track {
                width: fit-content;
                animation: scroll 20s linear infinite;
            }
            
            .tech-track:hover {
                animation-play-state: paused;
            }
            
            .tech-slide {
                float: left;
            }

            #bg-canvas {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                pointer-events: none;
            }
        </style>
    </head>
    <body class="min-h-screen text-text-primary-light dark:text-text-primary-dark">
        {{ partial "header" . }}
        <main class="relative z-10">
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer" . }}
        <script src="{{ "js/background.js" | relURL }}"></script>
    </body>
</html>
