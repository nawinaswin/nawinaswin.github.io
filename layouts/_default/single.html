{{ define "main" }}
<article class="max-w-4xl mx-auto px-4 sm:px-6 py-12">
    <div class="max-w-3xl mx-auto p-6 sm:p-8 border border-border-primary-light dark:border-border-primary-dark rounded-2xl bg-bg-secondary-light dark:bg-bg-secondary-dark">
        <h1 class="text-4xl font-bold mb-4 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
        {{ if eq .Section "blogs" }}
        <div class="flex flex-wrap items-center gap-4 mb-8 text-text-secondary-light dark:text-text-secondary-dark">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            {{ range .Params.tags }}
            <span class="px-2 py-1 bg-bg-tertiary-light dark:bg-bg-tertiary-dark rounded-md text-xs">{{ . }}</span>
            {{ end }}
        </div>
        {{ end }}
        {{ with .Params.image }}
        <figure class="my-6">
            <img src="{{ . | relURL }}" alt="{{ $.Params.image_alt | default $.Title }}" class="project-demo rounded-lg" decoding="async">
            {{ with $.Params.image_caption }}
            <figcaption class="text-sm mt-3 text-text-secondary-light dark:text-text-secondary-dark">{{ . }}</figcaption>
            {{ end }}
        </figure>
        {{ end }}
        {{ with .Params.tech }}
        <div class="flex flex-wrap gap-2 mb-6">
            {{ range . }}
            <span class="px-2 py-1 rounded-md bg-bg-tertiary-light dark:bg-bg-tertiary-dark text-sm text-text-secondary-light dark:text-text-secondary-dark">{{ . }}</span>
            {{ end }}
        </div>
        {{ end }}
        <div class="site-prose">{{ .Content }}</div>
    </div>
</article>
{{ end }}
