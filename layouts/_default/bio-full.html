{{ define "main" }}
<article class="max-w-4xl mx-auto px-4 sm:px-6 py-12">
    <p class="mb-6 text-text-secondary-light dark:text-text-secondary-dark">
        <a href="{{ "about/" | relURL }}" class="underline underline-offset-4">← Back to About</a>
    </p>
    <div class="p-6 sm:p-10 border border-border-primary-light dark:border-border-primary-dark rounded-2xl bg-bg-secondary-light dark:bg-bg-secondary-dark">
        <h1 class="text-4xl font-bold mb-6 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
        <div class="bio-content text-text-primary-light dark:text-text-primary-dark">
            {{ .Content }}
        </div>
    </div>
</article>
<style>
    .bio-content { line-height: 1.8; overflow-wrap: anywhere; }
    .bio-content p { margin: 0 0 1.25rem; }
    .bio-content h2 { font-size: 1.75rem; font-weight: 700; margin: 2.5rem 0 1rem; line-height: 1.3; }
    .bio-content h3 { font-size: 1.25rem; font-weight: 600; margin: 1.75rem 0 0.75rem; line-height: 1.4; }
    .bio-content ul { list-style: disc; padding-left: 1.5rem; margin: 0 0 1.5rem; }
    .bio-content li { margin-bottom: 0.75rem; }
    .bio-content a { text-decoration: underline; text-underline-offset: 3px; }
    .bio-content a:hover { text-decoration-thickness: 2px; }
</style>
{{ end }}
